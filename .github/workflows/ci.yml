name: TrustCart CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.4.4
      - name: Run ruff
        run: ruff check backend/

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install mypy types-redis
      - name: Run mypy
        run: mypy backend/app --ignore-missing-imports --no-strict-optional

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trustcart
          POSTGRES_PASSWORD: trustcart
          POSTGRES_DB: trustcart_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+asyncpg://trustcart:trustcart@localhost:5432/trustcart_test
      REDIS_URL: redis://localhost:6379/0
      LLM_PROVIDER: gemini
      GEMINI_API_KEY: dummy_key_for_ci
      RAZORPAY_KEY_ID: ""
      RAZORPAY_KEY_SECRET: ""
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run tests
        working-directory: backend
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing
