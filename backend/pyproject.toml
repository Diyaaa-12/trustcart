[project]
name = "trustcart-backend"
version = "1.0.0"
description = "TrustCart — bounded, auditable upsell/cross-sell agent"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "T20"]
ignore = [
    "ANN101",  # missing type annotation for self
    "ANN102",  # missing type annotation for cls
    "ANN401",  # Dynamically typed expressions (Any)
    "S101",    # use of assert (fine in tests)
    "B008",    # function call in argument defaults (FastAPI Depends)
    "B904",    # raise ... from ... in except clause
]
per-file-ignores = { "tests/*" = ["ANN", "S"], "app/seed.py" = ["E501"] }

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = ["app/seed.py", "*/migrations/*"]
